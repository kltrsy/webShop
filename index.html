<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous" defer></script>
    

    <script src="scripts.js" defer></script>
    <link rel="stylesheet" href="styles.css">

    <link rel="icon" type="image/x-icon" href="resources/pixie.png">

    <title>Ashie Shop</title>
</head>

<body>
    
    <!--Header n stuff-->
    
    <header class="p-3 mb-3 border-bottom" id="head">
       <div class="container">
         <div class="d-flex p-2 flex-wrap align-items-center justify-content-center justify-content-lg-start">
           <ul class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0"> 
            <li>

              <button id="secret" class="btn" type="button">
                <img src="resources/pixie.png" alt="Pixie" class="img-fluid" id="rotrot">
                <img src="resources/logo.png" alt="Ashie" class="img-fluid" id="rotrot">
              </button>

            </li> 
            <li>
              <div class="dropdown">
                <button class="btn dropdown-toggle categories" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                  <img src="resources/_3lines.png" alt="" class="img-fluid"><img src="resources/categories.png" alt="Categories" class="img-fluid">
                </button>
                <ul class="dropdown-menu"  id="downer" style="width: 100%;">
                  <li><button class="dropdown-item" value="all" onclick="duckyou(this)">All</button></li>
                  <li><button class="dropdown-item" value="men's clothing" onclick="duckyou(this)">Men's clothing</button></li>
                  <li><button class="dropdown-item" value="jewelery" onclick="duckyou(this)">Jewelery</button></li>
                  <li><button class="dropdown-item" value="electronics" onclick="duckyou(this)">Electronics</button></li>
                  <li><button class="dropdown-item" value="women's clothing" onclick="duckyou(this)">Women's clothing</button></li>
                </ul>
             </div>
          </li> 
            <li>
              <form class="form-check" role="search">
                <input type="search" class="form-control" placeholder="Search..." aria-label="Search" id="search">
             </form>
          </li> 
          <li>
            <img src="resources/glass.png" alt="" id="glass">
          </li>
          
            <li>
              
              <button id="rotbasket" class="btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasWithBackdrop" aria-controls="offcanvasWithBackdrop"><img src="resources/basket.png" alt="basket" onclick="checkOut()" ></button>
          </li> 
          </ul> 
          

          <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasWithBackdrop" aria-labelledby="offcanvasWithBackdropLabel">
            <div class="offcanvas-header">
              <button type="button" class="btn" id="basketupper"  data-bs-dismiss="offcanvas"><img src="resources/basket_check.png" alt=""></h5></button>
            </div>
            <div class="offcanvas-body">
                <div id="shopperCart">                  
                </div>
                <h2 id="total" class="text-center">
                </h2>
                <button class="btn" id="basketbuttom" onclick="checkOuter()" ><img src="resources/checkout.png" alt=""></button>
            </div>
         </div>
        </div> 
      </header>
  
    <img src="resources/sky_camera_v2.png" alt="" id="cam">
    <div id="bigLad"></div>

    <!--Footer n stuff-->
    <div id="fotter">

      <div class="d-flex flex-row buttombuyBg">
        <div class="p-1">
          <p>© 2026 Gyapjas András</p>
        </div>
        <div class="p-1">
          <img src="resources/me.png" alt="">
        </div>
    </div>
  </div>
</body>

</html>
