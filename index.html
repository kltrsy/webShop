<body>

            <li>

              <button id="secret" class="btn" type="button">
                <img src="resources/pixie.png" alt="Pixie" class="img-fluid" id="pix">
                <img src="resources/logo.png" alt="Ashie" class="img-fluid">
              </button>

            </li> 
            <li>
              <div class="dropdown">
                <button class="btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                  <img src="resources/_3lines.png" alt="" class="img-fluid"><img src="resources/categories.png" alt="Categories" class="img-fluid">
                </button>
                <ul class="dropdown-menu"  id="downer">
                  <li><button class="dropdown-item" value="all" onclick="duckyou(this)">All</button></li>

                </ul>
             </div>
          </li> 
            <li>
              <input type="search" class="form-control" placeholder="Search..." aria-label="Search" id="search">
          </li> 
            <li>
              <button class="btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasWithBackdrop" aria-controls="offcanvasWithBackdrop"><img src="resources/basket.png" alt="basket" onclick="checkOut()"></button>
          </li> 
          </ul> 

          <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasWithBackdrop" aria-labelledby="offcanvasWithBackdropLabel">
            <div class="offcanvas-header">
              <h5 class="offcanvas-title" id="offcanvasWithBackdropLabel">Basket</h5>
              <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
                <div id="shopperCart">
                  
                </div>
                <p id="total">
                    
                </p>
                <button onclick="checkOuter()" >Check out!</button>
              
            </div>

        </div>
